name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.14.0
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run test:gateway
      - run: npm run test:package
      - run: npm run check:publication
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: browser-report-${{ matrix.os }}-${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: npm-publish-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: npm ci
      - name: Check main is still this commit
        id: head
        run: |
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote_head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit exists; skipping this publication."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Select unpublished version
        id: release
        if: steps.head.outputs.current == 'true'
        run: node --import tsx scripts/prepare-release.ts
      - name: Publish public package with OIDC
        if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --ignore-scripts
      - name: Verify published commit
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { name } = JSON.parse(readFileSync('package.json', 'utf8'));
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${process.env.RELEASE_VERSION}`;
          for (let attempt = 0; attempt < 6; attempt++) {
            const response = await fetch(url);
            if (response.ok) {
              const published = await response.json();
              if (published.gitHead !== process.env.GITHUB_SHA) throw Error('Published commit does not match this run');
              console.log(`Verified ${name}@${published.version} (${published.gitHead})`);
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw Error('Published version could not be verified');
          JS
